{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Task Manager{% endblock %}</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><nav><div class="container nav"><a class="brand" href="{% url 'dashboard' %}">Task Manager</a><div>{% if user.is_authenticated %}<span>Hi, {{ user.username }}</span> <a href="{% url 'create_task' %}">New Task</a> <a href="{% url 'logout' %}">Logout</a>{% else %}<a href="{% url 'login' %}">Login</a> <a href="{% url 'register' %}">Register</a>{% endif %}</div></div></nav><main class="container">{% if messages %}{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body></html>
